name: Build APK

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The legacy "tools" package was removed from the SDK repository, and the
          # action's historical default (`tools platform-tools`) makes sdkmanager
          # fail with "Failed to find package 'tools'". Only ask for what we need.
          packages: platform-tools

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # AGP 9.1.x requires Gradle 9.3.1+; keep this in sync with
          # gradle/wrapper/gradle-wrapper.properties.
          gradle-version: "9.3.1"

      - name: Build debug APK
        env:
          # Optional. If unset, social URLs fail clearly and direct media URLs
          # remain available. Configure this repository variable for yt-dlp.
          YTDLP_API_URL: ${{ vars.YTDLP_API_URL }}
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vid-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
